name: Daily Meal Scraper

on:
  schedule:
    # 매일 15:00 UTC = 매일 00:00 KST
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape SNUE meal data
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 0
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: node scraper.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
